name: CI

# Runs on every PR and every push to main. Deploy is a separate workflow that
# waits on this one, so nothing reaches cobrain.co without a green build.
on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch. Never cancel on
# main: those runs are what the deploy workflow gates against.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  web:
    name: Web — typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite imports server modules that construct a Prisma client, and
    # `lib/config/env` validates connection strings at import time. These are
    # throwaway values for a service container — no real credential belongs in
    # a workflow file.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: c_brain_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/c_brain_ci
      AUTH_DATABASE_URL: postgresql://ci:ci@localhost:5432/c_brain_ci
      BETTER_AUTH_SECRET: ci-not-a-real-secret
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile is the point: a lockfile that drifted from
      # package.json means CI is testing different dependency versions than
      # production will run.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma generates to lib/generated/prisma; without this, tsc fails on
      # every model type. postinstall usually does it, but not when the store
      # is restored from cache.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Advisory, not a gate — and deliberately so. The repository currently
      # has ~676 pre-existing eslint errors (mostly `no-explicit-any` in the
      # older connectors), so a blocking lint step would fail on the first push
      # and wedge every deploy behind unrelated debt.
      #
      # Typecheck and tests above ARE gates and both pass, so this loses no
      # real safety. Flip `continue-on-error` to false once the baseline is
      # clean; the intent is a ratchet, not a permanent exemption.
      - name: Lint (advisory)
        continue-on-error: true
        run: pnpm lint

      # Blocking for the code this change actually touches, so new work cannot
      # add to the backlog even while the backlog exists.
      - name: Lint changed files (blocking)
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit (first push or force-push) — skipping."
            exit 0
          fi

          FILES=$(
            git diff --name-only --diff-filter=ACMR "$BASE" HEAD |
              grep -E '\.(ts|tsx)$' |
              grep -vE '^(lib/generated|\.next)/' || true
          )

          if [ -z "$FILES" ]; then
            echo "No TypeScript files changed."
            exit 0
          fi

          echo "Linting:"; echo "$FILES" | sed 's/^/  /'
          # shellcheck disable=SC2086
          pnpm exec eslint $FILES

      - name: Test
        run: pnpm test

      # Catches a schema edited without a matching migration — the failure that
      # otherwise appears at deploy time, after the images are already built.
      - name: Migrations match schema
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "schema and migrations agree" || {
              echo "::error::prisma/schema.prisma has changes with no migration. Run: pnpm exec prisma migrate dev"
              exit 1
            }

  python:
    name: Python — compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      # Byte-compiles every module: catches a syntax error in a worker that no
      # test imports, which would otherwise only surface when the container
      # restarts in production.
      - name: Compile all modules
        run: python -m compileall -q backend/python backend/m_learning

      - name: Test
        run: python -m pytest backend/m_learning/tests -q

  images:
    name: Images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build only after the code is known good — a Docker build is the slowest
    # step here and tells us nothing a failing typecheck hasn't already.
    needs: [web, python]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. This job exists to fail the PR when a Dockerfile
      # breaks; publishing is the deploy workflow's job.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/python/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
