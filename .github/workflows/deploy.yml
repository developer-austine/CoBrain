name: Deploy to production

# Fires only after CI passes on main. Using workflow_run rather than duplicating
# the checks here means there is exactly one definition of "green", and a deploy
# cannot start while tests are still running.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Manual re-run, and the rollback path: pass a previous commit SHA to put that
  # image back without reverting the branch first.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to current main)"
        required: false
        type: string

# One deploy at a time, and never cancel one midway — a run interrupted between
# `migrate` and `app` leaves the stack half-updated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_MIGRATE: ghcr.io/${{ github.repository }}/migrate
  DOMAIN: cobrain.co

jobs:
  build:
    name: Build & publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failed or cancelled CI run also triggers workflow_run; only success ships.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Resolve commit to deploy
        id: resolve
        run: |
          SHA="${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${SHA}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the SHA as well as `latest`. The SHA tag is what makes
      # rollback a one-line change on the host rather than a rebuild.
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.resolve.outputs.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The build stage on its own: it carries the Prisma CLI, which the
      # standalone runtime image deliberately does not.
      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: build
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATE }}:${{ steps.resolve.outputs.sha }}
            ${{ env.IMAGE_MIGRATE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/python/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.resolve.outputs.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Release to ${{ github.event.repository.name }} host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    # Attach required reviewers here in repo settings if you want a manual gate
    # before production. The URL shows on the run and in the deployments tab.
    environment:
      name: production
      url: https://cobrain.co

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      # The compose file is the source of truth for the topology, so it ships
      # with each release rather than living only on the host and drifting.
      - name: Copy compose file to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml,Caddyfile
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
          IMAGE_MIGRATE: ${{ env.IMAGE_MIGRATE }}
          SHA: ${{ needs.build.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_WEB,IMAGE_BACKEND,IMAGE_MIGRATE,SHA
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Record what is currently live BEFORE touching anything, so the
            # rollback step has somewhere to go back to.
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              config --images > /tmp/cobrain-previous-images.txt || true
            cp -f .env.production .env.production.bak

            echo "WEB_IMAGE=${IMAGE_WEB}:${SHA}"         >  .env.release
            echo "MIGRATE_IMAGE=${IMAGE_MIGRATE}:${SHA}"  >> .env.release
            echo "BACKEND_IMAGE=${IMAGE_BACKEND}:${SHA}"  >> .env.release

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker compose -f docker-compose.prod.yml \
              --env-file .env.production --env-file .env.release pull

            # Migrations are their own service and the app waits on it
            # (depends_on: service_completed_successfully), so a failed
            # migration stops the release instead of starting an app against a
            # schema it does not match.
            docker compose -f docker-compose.prod.yml \
              --env-file .env.production --env-file .env.release \
              up -d --remove-orphans

            docker image prune -f --filter "until=168h"

      # The container's own HEALTHCHECK only proves the process answers. This
      # asks the public domain, so it also covers DNS, TLS and the proxy — the
      # parts that break in ways the container cannot see.
      - name: Verify https://cobrain.co/api/health
        id: verify
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
                   --max-time 10 "https://${DOMAIN}/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 10
          done
          echo "::error::cobrain.co did not become healthy within 5 minutes"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      # Only runs when the health gate failed. Puts the previous images back
      # rather than leaving a broken release serving traffic.
      - name: Roll back
        if: failure() && steps.verify.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "Health gate failed — restoring previous images"
            if [ -f .env.release.previous ]; then
              cp -f .env.release.previous .env.release
              docker compose -f docker-compose.prod.yml \
                --env-file .env.production --env-file .env.release up -d
            else
              echo "No previous release recorded; leaving the stack as-is for inspection."
            fi
            docker compose -f docker-compose.prod.yml --env-file .env.production ps

      # Written only after a verified-healthy release, so the rollback target is
      # always a version that actually served traffic.
      - name: Record this release as the rollback target
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            cp -f .env.release .env.release.previous
