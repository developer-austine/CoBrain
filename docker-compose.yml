version: '3.8'

services:
  postgres:
      image: postgres:15-alpine
      container_name: company_brain_postgres
      restart: always
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: dev1234
        POSTGRES_DB: c_brain
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  # 2. Broker Layer: Orchestrates the queue dataflow from Next.js to Python
  redis:
    image: redis:7.2-alpine
    container_name: company_brain_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Vector Layer: Houses the final embedded text chunks for RAG semantic search
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: company_brain_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data: